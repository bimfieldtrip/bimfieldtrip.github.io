<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>Field Visits · KAIST BIM Shanghai Field Trip Hub</title>
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2746%27 fill=%27%23ffffff%27 stroke=%27%231a2c5c%27 stroke-width=%274%27/%3E%3Ccircle cx=%2750%27 cy=%2730%27 r=%277%27 fill=%27%231a2c5c%27/%3E%3Ccircle cx=%2728%27 cy=%2770%27 r=%277%27 fill=%27%234863b5%27/%3E%3Ccircle cx=%2772%27 cy=%2770%27 r=%277%27 fill=%27%234863b5%27/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="host-orgs">
<a class="skip-link" href="#main">본문 바로가기</a>

<div class="demo-strip"><span class="demo-strip__dot"></span><strong>OFFICIAL SCHEDULE</strong>&nbsp;— Guide 장소는 참고용</div>

<header class="site-header">
  <div class="site-header__bar">
    <a class="brand" href="index.html">
      <span class="brand__mark" data-brand-mark></span>
      <span class="brand__text">KAIST BIM</span>
      <span class="brand__sub">Shanghai Field Trip Hub</span>
    </a>
    <button class="nav-toggle" data-nav-toggle aria-label="메뉴 열기" aria-expanded="false"></button>
  </div>
  <nav class="site-nav" data-site-nav aria-label="주요 메뉴"><ul class="site-nav__list"></ul></nav>
</header>

<main id="main" class="container">
  <div class="page-head">
    <div class="kicker">FIELD VISITS</div>
    <h1>방문 회사 · 학교</h1>
    <p class="page-head__desc">2026.12.27~31 공식 일정의 방문처 6곳입니다(방문 순서). 각 카드를 누르면 Schedule 화면의 기관 소개·주소·지도로 이동합니다.</p>
  </div>

  <div class="grid grid--2" id="orgs-root"></div>
</main>

<footer class="site-footer">SHANGHAI FIELD TRIP HUB · v0.9.0 · OFFICIAL SCHEDULE</footer>
<nav class="bottom-nav" data-bottom-nav aria-label="주요 메뉴 (모바일)"></nav>

<script src="js/config.js"></script>
<script src="js/data-trip.js"></script>
<script src="js/main.js"></script>
<script>
  function renderOrgList() {
    document.getElementById("orgs-root").innerHTML = ORGS.map((org) => {
      const day = ITINERARY.find((d) => d.date === org.visitDate);
      const [, m, dd] = org.visitDate.split("-").map(Number);
      return `
      <a class="card is-hoverable" href="itinerary.html#org-${org.id}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;">
          <h3 style="margin-bottom:4px;">${org.name_en}</h3>
          ${statusBadge(org.status)}
        </div>
        <p class="mono text-faint" style="margin:0 0 8px; font-size:.76rem;">${m}/${dd}${day ? " (" + day.weekday + ")" : ""} ${org.slot} · ${org.name_zh}</p>
        <p class="text-muted" style="margin-bottom:8px;">${org.type}</p>
        <div class="keyword-list">${org.keywords.map((k) => `<span class="keyword-chip">${k}</span>`).join("")}</div>
        <p class="mono" style="margin:14px 0 0; font-weight:700; color:var(--navy-700); font-size:.82rem;">BRIEFING ${icon("chevron")}</p>
      </a>`;
    }).join("");
  }
  document.addEventListener("DOMContentLoaded", renderOrgList);
</script>
</body>
</html>
